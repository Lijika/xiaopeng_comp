<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>登记证证据工作台 · R-OBSERVED</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        color: #17211d;
        background: #f2f4f3;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        background: #f2f4f3;
      }

      header {
        border-bottom: 1px solid #d5dbd8;
        background: #ffffff;
      }

      .header-inner,
      main {
        width: min(1280px, calc(100% - 40px));
        margin: 0 auto;
      }

      .header-inner {
        min-height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 19px;
        line-height: 1.3;
      }

      .brand p,
      .status,
      dt,
      .empty {
        color: #65706b;
        font-size: 12px;
      }

      .brand p {
        margin-top: 3px;
      }

      .badges {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .badge {
        min-height: 27px;
        display: inline-flex;
        align-items: center;
        border: 1px solid #aab4af;
        border-radius: 4px;
        padding: 4px 8px;
        color: #34413b;
        background: #f8faf9;
        font-size: 11px;
        font-weight: 700;
      }

      .badge.track {
        border-color: #75a894;
        color: #15553f;
        background: #e8f3ee;
      }

      main {
        margin-top: 20px;
        margin-bottom: 36px;
      }

      .toolbar {
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      button {
        min-width: 40px;
        min-height: 36px;
        border: 1px solid #1f6b55;
        border-radius: 5px;
        padding: 7px 13px;
        color: #ffffff;
        background: #1f6b55;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #16513f;
      }

      button:focus-visible {
        outline: 3px solid #eaa33a;
        outline-offset: 2px;
      }

      button:disabled {
        border-color: #adb7b2;
        color: #68736e;
        background: #dfe4e1;
        cursor: wait;
      }

      .workbench {
        display: grid;
        grid-template-columns: minmax(280px, 0.72fr) minmax(520px, 1.28fr);
        gap: 14px;
        align-items: start;
      }

      .panel {
        min-width: 0;
        border: 1px solid #d5dcda;
        border-radius: 6px;
        background: #ffffff;
      }

      .panel-header {
        min-height: 45px;
        border-bottom: 1px solid #e1e6e3;
        padding: 11px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-header h2 {
        font-size: 14px;
        line-height: 1.35;
      }

      .count {
        color: #3f4d46;
        font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .panel-body {
        min-height: 184px;
        padding: 14px;
      }

      .queue-item {
        width: 100%;
        min-height: 76px;
        border: 1px solid #91a099;
        padding: 11px 12px;
        color: #1d2b25;
        background: #f8faf9;
        text-align: left;
      }

      .queue-item strong,
      .queue-item span {
        display: block;
        overflow-wrap: anywhere;
      }

      .queue-item span {
        margin-top: 5px;
        color: #5f6b65;
        font-size: 11px;
        font-weight: 500;
      }

      dl {
        margin: 0;
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 9px 12px;
        align-items: baseline;
      }

      dd {
        min-width: 0;
        margin: 0;
        color: #1d2a24;
        font: 650 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
      }

      .empty {
        min-height: 156px;
        display: grid;
        place-items: center;
        text-align: center;
      }

      .error {
        color: #a13a33;
      }

      @media (max-width: 820px) {
        .header-inner,
        main {
          width: min(100% - 24px, 680px);
        }

        .header-inner {
          min-height: 84px;
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          gap: 8px;
        }

        .badges {
          justify-content: flex-start;
        }

        .workbench {
          grid-template-columns: minmax(0, 1fr);
        }

        dl {
          grid-template-columns: minmax(108px, 0.42fr) minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="brand">
          <h1>登记证证据工作台</h1>
          <p>Reviewer workspace · read only</p>
        </div>
        <div class="badges" aria-label="证据声明">
          <span class="badge track">R-OBSERVED</span>
          <span class="badge">跨文档机会 0</span>
          <span class="badge">性能 not estimable</span>
        </div>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <p class="status" id="status" role="status" aria-live="polite">正在同步</p>
        <button type="button" id="refresh">刷新</button>
      </div>

      <div class="workbench">
        <section class="panel" aria-labelledby="queue-title">
          <div class="panel-header">
            <h2 id="queue-title">Reviewer queue</h2>
            <span class="count" id="queue-count">0</span>
          </div>
          <div class="panel-body" id="queue-body">
            <p class="empty">暂无待审 observation</p>
          </div>
        </section>

        <section class="panel" aria-labelledby="trace-title">
          <div class="panel-header">
            <h2 id="trace-title">Finding trace</h2>
            <span class="count" data-testid="claim-label">R-OBSERVED</span>
          </div>
          <div class="panel-body" id="trace-body">
            <p class="empty">未选择 finding</p>
          </div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        "use strict";

        const apiRoot = "/controlled/s02/api";
        const queueBody = document.getElementById("queue-body");
        const traceBody = document.getElementById("trace-body");
        const queueCount = document.getElementById("queue-count");
        const status = document.getElementById("status");
        const refresh = document.getElementById("refresh");

        function text(tag, value, testId) {
          const node = document.createElement(tag);
          node.textContent = value == null ? "—" : String(value);
          if (testId) node.dataset.testid = testId;
          return node;
        }

        function traceRow(list, label, value, testId) {
          list.append(text("dt", label));
          list.append(text("dd", value, testId));
        }

        async function request(path) {
          const response = await fetch(path, {
            credentials: "same-origin",
            cache: "no-store",
            headers: { Accept: "application/json" },
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        }

        async function loadTrace(item) {
          const blocker = (item.blockers || [])[0];
          const suffix = blocker
            ? `?finding_id=${encodeURIComponent(blocker.finding_id)}`
            : "";
          const workspace = await request(
            `${apiRoot}/queries/applications/${encodeURIComponent(item.application_id)}/workspace${suffix}`,
          );
          const finding = workspace.selected_finding;
          const link = finding && (finding.evidence_links || [])[0];
          traceBody.replaceChildren();
          if (!finding || !link) {
            traceBody.append(text("p", "未找到可审 evidence", "trace-empty"));
            return;
          }
          const list = document.createElement("dl");
          traceRow(list, "Finding", finding.finding_id, "finding-id");
          traceRow(list, "Field", link.field, "field");
          traceRow(list, "Observation", link.observation_id, "observation-id");
          traceRow(list, "Producer", `${link.producer_family} / ${link.producer_id}`);
          traceRow(list, "Model", `${link.model_id} / ${link.model_version}`);
          traceRow(list, "Run", link.producer_run_id, "producer-run-id");
          traceRow(list, "Page", link.source_page);
          traceRow(list, "Region", JSON.stringify(link.source_region));
          traceRow(list, "Object SHA-256", link.source_sha256, "object-sha256");
          traceRow(list, "Receipt", link.source_receipt_id, "source-receipt-id");
          traceRow(list, "Eligibility", link.eligibility_reason, "eligibility-reason");
          traceBody.append(list);
        }

        async function loadQueue() {
          refresh.disabled = true;
          status.classList.remove("error");
          status.textContent = "正在同步";
          try {
            const queue = await request(`${apiRoot}/queries/queue`);
            const items = Array.isArray(queue.items) ? queue.items : [];
            queueCount.textContent = String(items.length);
            queueBody.replaceChildren();
            if (!items.length) {
              queueBody.append(text("p", "暂无待审 observation"));
              traceBody.replaceChildren(text("p", "未选择 finding"));
            } else {
              const item = items[0];
              const button = text("button", item.application_id, "queue-item");
              button.type = "button";
              button.className = "queue-item";
              button.append(text("span", `${item.phase} · ${item.route}`));
              button.addEventListener("click", () => loadTrace(item));
              queueBody.append(button);
              await loadTrace(item);
            }
            status.textContent = `Projection ${queue.projection_watermark}`;
          } catch (error) {
            status.textContent = "工作台暂不可用";
            status.classList.add("error");
          } finally {
            refresh.disabled = false;
          }
        }

        refresh.addEventListener("click", loadQueue);
        loadQueue();
      })();
    </script>
  </body>
</html>
